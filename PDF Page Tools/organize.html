<!-- organize.html : fragment -->
<div class="pdf-layout eq">
<div class="panel">
  <div class="panel-header">
    <div class="panel-icon">🗂️</div>
    <div class="panel-title">Input Organize</div>
    <button type="button" class="btn btn-secondary btn-reset" onclick="clearOrganize(); autoHitung();">Reset</button>
  </div>
  <div class="fgrid">
    <div class="form-group">
      <label class="form-label">Sampai angka berapa? (wajib)</label>
      <input id="batas" type="number" class="form-input" placeholder="contoh: 70">
    </div>
    <div class="form-group">
      <label class="form-label">Kelipatan berapa? (wajib)</label>
      <input id="kelipatan" type="number" class="form-input" placeholder="contoh: 7">
    </div>
    <div class="form-group span2">
      <label class="form-label">Tambah halaman sebelum kelipatan? (opsional)</label>
      <input id="tambahan" type="number" class="form-input" placeholder="contoh: 3">
    </div>
  </div>
</div>

<div class="panel">
  <div class="panel-header">
    <div class="panel-icon">📋</div>
    <div class="panel-title">Hasil</div>
    <button type="button" class="btn btn-secondary btn-reset" onclick="copyOrganize()">Copy Hasil</button>
  </div>
  <p id="pdf-empty" class="hint">Isi data di sebelah kiri, hasil muncul otomatis.</p>
  <div id="pdf-warn" class="warn hidden"></div>
  <textarea id="hasilOrganize" class="form-textarea" rows="6" readonly placeholder="Hasil muncul di sini"></textarea>
  <p id="notifOrganize" class="note text-ok hidden">✔ Berhasil dicopy!</p>
  <p id="warningOrganize" class="note text-err hidden">Isi semua input wajib!</p>
</div>
</div>
