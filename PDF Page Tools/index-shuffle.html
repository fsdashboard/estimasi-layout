  <style>
    .hidden { display: none !important; }
    .pdf-wrap { max-width: calc(440px + 640px + 1.25rem); margin: 0 auto; }
    .tab-row { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: flex-start; margin-bottom: 1rem; }
    .tab-row .btn { display: inline-flex; align-items: center; text-decoration: none; }
    .note { margin-top: 0.5rem; font-size: 0.85rem; color: var(--muted); }
    .text-ok { color: #3fb950; }
    .text-err { color: #ff6b6b; }
    .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.85rem; }

    /* input (kiri) + hasil (kanan) */
    .pdf-layout { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 640px); gap: 1.25rem; justify-content: center; align-items: start; }
    .pdf-layout.eq { align-items: stretch; }
    .pdf-layout .panel { margin: 0; }
    .pdf-layout .panel-header { display: flex; align-items: center; }
    .btn-reset { margin-left: auto; padding: 0.35rem 0.8rem; font-size: 0.8rem; }
    .fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.7rem 0.75rem; }
    .fgrid .form-group { margin: 0; }
    .fgrid .form-label { display: block; margin: 0 0 0.3rem; font-size: 0.85rem; }
    .span2 { grid-column: 1 / -1; }
    .hint { margin: 0 0 0.75rem; font-size: 0.85rem; color: var(--muted); }
    .warn { margin-bottom: 0.75rem; padding: 0.75rem 0.9rem; border: 1px solid rgba(255, 107, 107, 0.4); border-radius: 10px; background: rgba(255, 107, 107, 0.08); color: #ff8a8a; font-size: 0.85rem; }

    .check-row { display: flex; align-items: center; gap: 0.6rem; margin: 0 0 0.75rem; cursor: pointer; color: var(--text); font-size: 0.9rem; }
    .check-row input, .rotate-box input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
    .slide-wrap { overflow-x: auto; margin-top: 1rem; color: var(--text); }
    .slide-wrap:first-child { margin-top: 0; }
    .slide-table { width: 100%; margin-top: 0.5rem; border-collapse: collapse; text-align: center; }
    .slide-cell { padding: 0.35rem; border: 1px solid var(--border); vertical-align: top; background: rgba(17, 24, 39, 0.9); color: var(--text); }
    .rotate-box { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; }
    .rotate-row { display: flex; gap: 6px; align-items: center; justify-content: center; }
    .rotate-row label { display: flex; gap: 4px; align-items: center; font-size: 0.75rem; color: var(--muted); cursor: pointer; }
    .gabungan-box { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-top: 1rem; padding: 1rem; border: 1px solid var(--border); border-radius: 10px; background: rgba(17, 24, 39, 0.9); color: var(--text); word-break: break-word; }
    .gabungan-box:first-child { margin-top: 0; }

    @media (max-width: 1000px) { .pdf-layout { grid-template-columns: 1fr; } }
    @media (max-width: 560px) { .fgrid { grid-template-columns: 1fr; } }
  </style>
</head>

  <div id="customAlert" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="alertTitle">Peringatan</div>
      </div>
      <div class="modal-body" id="alertMessage"></div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="tutupAlert()">Oke</button>
      </div>
    </div>
  </div>

  <script>
    let currentKonten = 1;
    const val = (id) => (document.getElementById(id)?.value || '').trim();

    // fungsi yang sudah ada di shuffle.js / organize.js (tidak diubah)
    const KONTEN = {
      1: {
        html: 'shuffle.html', js: 'shuffle.js',
        fn: () => buatAcuan(),
        lengkap: () => val('isiHalaman') !== '' && val('baris') !== '' && val('kolom') !== '' &&
                       ['1 Sisi', '2 Sisi'].includes(val('slide')),
        kosong: () => { const o = document.getElementById('output'); if (o) o.innerHTML = ''; }
      },
      2: {
        html: 'organize.html', js: 'organize.js',
        fn: () => generateOrganize(),
        lengkap: () => val('batas') !== '' && val('kelipatan') !== '',
        kosong: () => {
          const h = document.getElementById('hasilOrganize'); if (h) h.value = '';
          const w = document.getElementById('warningOrganize'); if (w) w.classList.add('hidden');
        }
      }
    };

    /* ===== HASIL OTOMATIS ===== */
    // Jalankan fungsi yang ada. Peringatan (alert / modal) dialihkan ke panel hasil
    // supaya tidak muncul pop-up saat user masih mengetik.
    function autoHitung() {
      const cfg = KONTEN[currentKonten];
      const empty = document.getElementById('pdf-empty');
      const warn = document.getElementById('pdf-warn');
      if (!empty || !warn) return;

      warn.classList.add('hidden');

      // input belum lengkap -> kosongkan hasil tanpa peringatan
      if (!cfg.lengkap()) {
        cfg.kosong();
        empty.classList.remove('hidden');
        return;
      }

      let msg = '';
      const origAlert = window.alert;
      const origShow = window.showAlert;
      window.alert = (m) => { msg = m; };
      window.showAlert = (m) => { msg = m; };
      try {
        cfg.fn();
      } catch (e) {
        cfg.kosong();
        empty.classList.remove('hidden');
        return;
      } finally {
        window.alert = origAlert;
        window.showAlert = origShow;
      }

      empty.classList.add('hidden');
      if (msg) {
        cfg.kosong();
        warn.textContent = msg;
        warn.classList.remove('hidden');
      }
    }

    function pasangAuto() {
      document.querySelectorAll('#konten input:not([readonly]), #konten select').forEach(el => {
        el.addEventListener('input', autoHitung);
        el.addEventListener('change', autoHitung);
      });
    }

    /* ===== DYNAMIC KONTEN ===== */
    function tampilkanKonten(n) {
      const kontenDiv = document.getElementById("konten");
      currentKonten = n;

      [["btn1", 1], ["btn2", 2]].forEach(([id, i]) => {
        const b = document.getElementById(id);
        b.classList.toggle("btn-primary", i === n);
        b.classList.toggle("btn-secondary", i !== n);
      });

      const cfg = KONTEN[n];

      const oldScript = document.getElementById("dynamicScript");
      if (oldScript) oldScript.remove();

      fetch(cfg.html)
        .then(res => res.text())
        .then(html => {
          kontenDiv.innerHTML = html;
          pasangAuto();

          const script = document.createElement("script");
          script.src = cfg.js;
          script.id = "dynamicScript";
          script.onload = () => autoHitung();
          document.body.appendChild(script);
        })
        .catch(() => { kontenDiv.innerHTML = "<p class='note text-err'>Gagal memuat konten.</p>"; });
    }

    document.getElementById("btn1").addEventListener("click", () => tampilkanKonten(1));
    document.getElementById("btn2").addEventListener("click", () => tampilkanKonten(2));
  </script>

  <script src="../assets/sidebar.js"></script>
  <script>tampilkanKonten(1);</script>
</body>
