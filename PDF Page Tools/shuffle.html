<!-- shuffle.html : fragment -->
<div class="pdf-layout">
<div class="panel">
  <div class="panel-header">
    <div class="panel-icon">🔀</div>
    <div class="panel-title">Input Shuffle</div>
    <button type="button" class="btn btn-secondary btn-reset" onclick="resetForm(); autoHitung();">Reset</button>
  </div>
  <div class="fgrid">
    <div class="form-group">
      <label class="form-label">Jumlah Halaman</label>
      <input id="isiHalaman" type="number" class="form-input" />
    </div>
    <div class="form-group">
      <label class="form-label">Slide</label>
      <select id="slide" class="form-select">
        <option>-- Sided --</option>
        <option>1 Sisi</option>
        <option>2 Sisi</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Baris &#x2B07;</label>
      <input id="baris" type="number" class="form-input" />
    </div>
    <div class="form-group">
      <label class="form-label">Kolom &#x27A1;</label>
      <input id="kolom" type="number" class="form-input" />
    </div>
    <div class="form-group">
      <label class="form-label">Posisi</label>
      <select id="posisi" class="form-select">
        <option>-- Auto --</option>
        <option>Portrait</option>
        <option>Landscape</option>
      </select>
    </div>
  </div>
</div>

<div class="panel">
  <div class="panel-header">
    <div class="panel-icon">📋</div>
    <div class="panel-title">Hasil Acuan</div>
  </div>
  <label class="check-row">
    <input type="checkbox" id="toggleSlide">
    Tampilkan Slide 1 dan Slide 2
  </label>
  <p id="pdf-empty" class="hint">Isi data di sebelah kiri, hasil muncul otomatis.</p>
  <div id="pdf-warn" class="warn hidden"></div>
  <div id="output"></div>
</div>
</div>
