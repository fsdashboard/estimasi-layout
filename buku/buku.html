  <link rel="stylesheet" href="../assets/app-theme.css" />
  <style>
    .hidden { display: none !important; }
    .buku-wrap { max-width: calc(640px + 340px + 1.25rem); margin: 0 auto; }
    .tab-row { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: flex-start; margin-bottom: 1rem; }
    .note { font-size: 0.85rem; color: var(--muted); }

    /* input (kiri) + hasil (kanan), dibuat ringkas agar muat tanpa scroll */
    .buku-layout { display: grid; grid-template-columns: minmax(0, 640px) minmax(0, 340px); gap: 1.25rem; justify-content: center; align-items: start; }
    .buku-layout .panel { margin: 0; }
    .buku-layout .panel-header { display: flex; align-items: center; }
    .btn-reset { margin-left: auto; padding: 0.35rem 0.8rem; font-size: 0.8rem; }

    .fgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.7rem 0.75rem; }
    .fgrid .form-group { margin: 0; }
    .fgrid .form-label { display: block; margin: 0 0 0.3rem; font-size: 0.85rem; }
    .span3 { grid-column: 1 / -1; }
    .sec { grid-column: 1 / -1; margin-top: 0.35rem; padding-top: 0.6rem; border-top: 1px solid var(--border); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

    .two-col { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 0.5rem; }
    .two-col .sep { color: var(--muted); font-weight: 600; }
    .orient { margin-top: 0.4rem; text-align: center; font-size: 0.8rem; font-style: italic; color: var(--muted); }

    .res-row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 0.6rem; padding: 0.7rem 0.9rem; border: 1px solid var(--border); border-radius: 10px; background: rgba(17, 24, 39, 0.9); }
    .res-label { margin: 0; font-size: 0.8rem; color: var(--muted); }
    .res-val { flex: 1; min-width: 0; padding: 0; border: 0; outline: none; background: transparent; text-align: right; color: var(--accent); font-size: 1rem; font-weight: 700; }
    .hint { margin: 0; font-size: 0.85rem; color: var(--muted); }
    .warn { padding: 0.75rem 0.9rem; border: 1px solid rgba(255, 107, 107, 0.4); border-radius: 10px; background: rgba(255, 107, 107, 0.08); color: #ff8a8a; font-size: 0.85rem; }

    .alert-overlay { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.6); }
    .alert-card { width: calc(100% - 2rem); max-width: 24rem; padding: 1.5rem; border: 1px solid var(--border); border-radius: 12px; background: #111827; color: var(--text); text-align: center; }
    .alert-card p { margin: 0 0 1rem; }
    .alert-card .btn { width: 100%; justify-content: center; }

    @media (max-width: 1000px) { .buku-layout { grid-template-columns: 1fr; } }
    @media (max-width: 640px) { .fgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>

    <div id="overlay" class="app-overlay"></div>

    <main class="app-main">
      <div class="app-content">
        <div class="page-header">
          <h2 class="page-title">Estimasi Buku</h2>
          <p class="page-subtitle">Estimasi perhitungan Soft Cover, Booklet, dan Spiral</p>
        </div>

        <div class="buku-wrap">
        <div class="tab-row">
          <button type="button" class="btn btn-secondary" data-file="soft-cover.html" onclick="loadForm('soft-cover.html')">Soft Cover</button>
          <button type="button" class="btn btn-secondary" data-file="booklet.html" onclick="loadForm('booklet.html')">Booklet</button>
          <button type="button" class="btn btn-secondary" data-file="spiral.html" onclick="loadForm('spiral.html')">Spiral</button>

  <!-- Modal Alert Global -->
  <div id="modal-alert" class="alert-overlay hidden">
    <div class="alert-card">
      <p id="modal-alert-message"></p>
      <button id="modal-alert-close" class="btn btn-primary" type="button">OK</button>
    </div>
  </div>

  <script>
    let currentForm = null;

    // fungsi hitung yang sudah ada di soft-cover.js / booklet.js / spiral.js (tidak diubah)
    const HITUNG = {
      'soft-cover.html': () => hitungSoftCover(),
      'booklet.html': () => hitungBooklet(),
      'spiral.html': () => hitungSpiral()
    };
    const OUTPUT_ID = {
      'soft-cover.html': 'output-softcover',
      'booklet.html': 'output-booklet',
      'spiral.html': 'output-spiral'
    };

    function loadForm(file) {
      const container = document.getElementById('form-container');
      if (!file) return;

      currentForm = file;
      document.querySelectorAll('.tab-row .btn').forEach(b => {
        const aktif = b.dataset.file === file;
        b.classList.toggle('btn-primary', aktif);
        b.classList.toggle('btn-secondary', !aktif);
      });

      fetch(file)
        .then(res => {
          if (!res.ok) throw new Error('Gagal memuat form');
          return res.text();
        })
        .then(html => {
          container.innerHTML = html;
          loadFormScript(file);
        })
        .catch(err => {
          showAlertModal(err.message);
        });
    }

    function loadFormScript(file) {
      const baseName = file.replace('.html', '');
      const existingScript = document.getElementById('form-script');
      if (existingScript) existingScript.remove();

      const script = document.createElement('script');
      script.src = `${baseName}.js`;
      script.id = 'form-script';
      script.onload = () => {
        // hasil otomatis: hitung ulang setiap input / pilihan berubah
        document.querySelectorAll('#form-container input:not([readonly]), #form-container select').forEach(el => {
          el.addEventListener('input', autoHitung);
          el.addEventListener('change', autoHitung);
        });
        autoHitung();
      };
      document.body.appendChild(script);
    }

    // Jalankan fungsi hitung yang ada. Peringatan (alert / modal) dialihkan ke panel hasil
    // supaya tidak muncul pop-up saat user masih mengetik.
    function autoHitung() {
      const fn = HITUNG[currentForm];
      if (!fn) return;

      const out = document.getElementById(OUTPUT_ID[currentForm]);
      const empty = document.getElementById('buku-empty');
      const warn = document.getElementById('buku-warn');
      if (!out || !empty || !warn) return;

      let msg = '';
      const origAlert = window.alert;
      const origModal = window.showAlertModal;
      window.alert = (m) => { msg = m; };
      window.showAlertModal = (m) => { msg = m; };
      try {
        fn();
      } catch (e) {
        msg = 'Lengkapi semua input.';
      } finally {
        window.alert = origAlert;
        window.showAlertModal = origModal;
      }

      warn.classList.add('hidden');
      if (msg) {
        out.classList.add('hidden');
        if (/^Lengkapi/i.test(msg)) {
          empty.classList.remove('hidden');
        } else {
          empty.classList.add('hidden');
          warn.textContent = msg;
          warn.classList.remove('hidden');
        }
      } else {
        empty.classList.add('hidden');
      }
    }

    // Modal Alert Global
    const modal = document.getElementById("modal-alert");
    const modalMessage = document.getElementById("modal-alert-message");
    const modalClose = document.getElementById("modal-alert-close");

    function showAlertModal(message) {
      modalMessage.textContent = message;
      modal.classList.remove("hidden");
      modalClose.focus();
    }

    modalClose.addEventListener("click", () => {
      modal.classList.add("hidden");
    });

    document.addEventListener("keydown", (e) => {
      if (!modal.classList.contains("hidden") && e.key === "Enter") {
        modal.classList.add("hidden");
      }
    });
  </script>

  <script src="../assets/sidebar.js"></script>
  <script>loadForm('soft-cover.html');</script>
</body>
