<!-- spiral.html : fragment -->
<div class="buku-layout">
<div class="panel">
  <div class="panel-header">
    <div class="panel-icon">📘</div>
    <div class="panel-title">Input Spiral</div>
    <button type="button" class="btn btn-secondary btn-reset" onclick="resetSpiralForm(); autoHitung();">Reset</button>
  </div>
<div class="fgrid">
  <div class="form-group">
    <label class="form-label">Jumlah Halaman</label>
    <input type="number" id="spiral-halaman" class="form-input" />
  </div>
  <div class="form-group">
    <label class="form-label">Jumlah Cetak</label>
    <input type="number" id="spiral-cetak" class="form-input" />
  </div>
  <div class="form-group">
    <label class="form-label">Ukuran Jadi</label>
    <select id="preset-ukuran-spiral" class="form-select">
      <option value="">-- Pilih Ukuran --</option>
      <option value="A3">A3 (29.7x42 cm)</option>
      <option value="A4">A4 (21x29.7 cm)</option>
      <option value="A5">A5 (14.8x21 cm)</option>
      <option value="A6">A6 (10.5x14.8 cm)</option>
      <option value="A7">A7 (7.4x10.5 cm)</option>
      <option value="custom">Custom Size</option>
    </select>
  </div>
  <div class="form-group span3 hidden" id="custom-size-row-spiral">
    <label class="form-label">Ukuran Jadi (cm)</label>
    <div class="two-col">
      <input type="number" placeholder="Panjang" id="spiral-panjang" class="form-input" />
      <span class="sep">x</span>
      <input type="number" placeholder="Lebar" id="spiral-lebar" class="form-input" />
    </div>
    <div id="preview-orientasi-spiral" class="orient">Orientasi: -</div>
  </div>
  <div class="sec">Cover</div>
  <div class="form-group">
    <label class="form-label">Bahan Cover</label>
    <select id="spiral-bahan-cover" class="form-select">
      <option value="">-- Pilih Kertas --</option>
      <option value="BOOK PAPER">BOOK PAPER</option>
      <option value="HVS 75 gsm">HVS 75 gsm</option>
      <option value="HVS 80 gsm">HVS 80 gsm</option>
      <option value="HVS 100 gsm">HVS 100 gsm</option>
      <option value="AP 120 gsm">AP 120 gsm</option>
      <option value="AP 150 gsm">AP 150 gsm</option>
      <option value="MP 120 gsm">MP 120 gsm</option>
      <option value="MP 150 gsm">MP 150 gsm</option>
      <option value="AC 210 gsm">AC 210 gsm</option>
      <option value="AC 230 gsm">AC 230 gsm</option>
      <option value="AC 260 gsm">AC 260 gsm</option>
      <option value="AC 310 gsm">AC 310 gsm</option>
      <option value="AC 400 gsm">AC 400 gsm</option>
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">Sided Cover</label>
    <select id="spiral-sisi-cover" class="form-select">
      <option value="">-- sided cover --</option>
      <option value="1">1 Sisi</option>
      <option value="2">2 Sisi</option>
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">Media Cetak Cover</label>
    <select id="spiral-media-cover" class="form-select">
      <option value="">-- media cover --</option>
      <option value="A3+">A3+</option>
      <option value="A3">A3</option>
      <option value="A4">A4</option>
    </select>
  </div>
  <div class="sec">Isi</div>
  <div class="form-group">
    <label class="form-label">Bahan Isi</label>
    <select id="spiral-bahan-isi" class="form-select">
      <option value="">-- Pilih Kertas --</option>
      <option value="BOOK PAPER">BOOK PAPER</option>
      <option value="HVS 75 gsm">HVS 75 gsm</option>
      <option value="HVS 80 gsm">HVS 80 gsm</option>
      <option value="HVS 100 gsm">HVS 100 gsm</option>
      <option value="AP 120 gsm">AP 120 gsm</option>
      <option value="AP 150 gsm">AP 150 gsm</option>
      <option value="MP 120 gsm">MP 120 gsm</option>
      <option value="MP 150 gsm">MP 150 gsm</option>
      <option value="AC 210 gsm">AC 210 gsm</option>
      <option value="AC 230 gsm">AC 230 gsm</option>
      <option value="AC 260 gsm">AC 260 gsm</option>
      <option value="AC 310 gsm">AC 310 gsm</option>
      <option value="AC 400 gsm">AC 400 gsm</option>
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">Sided Isi</label>
    <select id="spiral-sisi-isi" class="form-select">
      <option value="">-- sided isi --</option>
      <option value="1">1 Sisi</option>
      <option value="2">2 Sisi</option>
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">Media Cetak Isi</label>
    <select id="spiral-media-isi" class="form-select">
      <option value="">-- media isi --</option>
      <option value="A3+">A3+</option>
      <option value="A3">A3</option>
      <option value="A4">A4</option>
    </select>
  </div>
</div>
</div>

<div class="panel">
  <div class="panel-header">
    <div class="panel-icon">📐</div>
    <div class="panel-title">Hasil</div>
  </div>
  <p id="buku-empty" class="hint">Isi data di sebelah kiri, hasil muncul otomatis.</p>
  <div id="buku-warn" class="warn hidden"></div>
  <div id="output-spiral" class="hidden">
    <div class="res-row" id="row-total-cover">
      <label class="res-label" id="label-total-cover">Total Cover dalam 1 A3+</label>
      <input type="text" id="spiral-total-cover" readonly class="res-val" />
    </div>
    <div class="res-row">
      <label class="res-label" id="label-total-isi">Total Isi dalam 1 A3+</label>
      <input type="text" id="spiral-total-isi" readonly class="res-val" />
    </div>
    <div class="res-row" id="row-lembar-cover">
      <label class="res-label">Jumlah Cetak Cover</label>
      <input type="text" id="spiral-lembar-cover" readonly class="res-val" />
    </div>
    <div class="res-row">
      <label class="res-label" id="label-lembar-isi">Jumlah Cetak Isi</label>
      <input type="text" id="spiral-lembar-isi" readonly class="res-val" />
    </div>
    <div class="res-row">
      <label class="res-label">Nomor Spiral</label>
      <input type="text" id="spiral-nomor" readonly class="res-val" />
    </div>
  </div>
</div>
</div>
