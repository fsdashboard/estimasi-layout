<!-- mata-ayam.html : fragment -->
<div class="io-layout">
<div class="panel">
  <div class="panel-header">
    <div class="panel-icon">🖼️</div>
    <div class="panel-title">Input Mata Ayam</div>
    <button type="button" class="btn btn-secondary btn-reset" onclick="resetSpandukForm(); autoHitung();">Reset</button>
  </div>
  <div class="form-group">
    <label class="form-label">Ukuran Jadi (cm)</label>
    <div class="two-col">
      <input id="spanduk-panjang" type="number" placeholder="Panjang" class="form-input" />
      <span class="sep">x</span>
      <input id="spanduk-lebar" type="number" placeholder="Lebar" class="form-input" />
    </div>
  </div>
  <div class="form-group">
    <label class="form-label">Jumlah Cetak</label>
    <input id="spanduk-jumlah" type="number" class="form-input" />
  </div>
  <div class="form-group">
    <label class="form-label">Fins / M-A Keliling (cm)</label>
    <input id="spanduk-fins" type="number" class="form-input" />
  </div>
</div>

<div class="panel">
  <div class="panel-header">
    <div class="panel-icon">📐</div>
    <div class="panel-title">Hasil</div>
  </div>
  <p id="io-empty" class="hint">Isi data di sebelah kiri, hasil muncul otomatis.</p>
  <div id="io-warn" class="warn hidden"></div>
  <div id="hasilSection" class="hidden">
    <div class="res-row"><label class="res-label">Tambahan M/A</label><input id="spanduk-totalma" type="text" readonly class="res-val" /></div>
  </div>
</div>
</div>
