<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pengiriman</title>
  <link rel="shortcut icon" href="logo/favicon.png" />
  <link rel="stylesheet" href="assets/app-theme.css" />
  <style>
    .preview-box {
      display: none;
      margin-top: 1rem;
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(17, 24, 39, 0.9);
    }

    .preview-box.show {
      display: block;
    }

    .preview-content {
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(9, 15, 25, 0.9);
      color: var(--text);
      line-height: 1.7;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1rem 0 1.5rem;
    }

    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .checkbox-group label {
      cursor: pointer;
    }

    /* ===== Kartu compact (seperti layout-a3-CONTOH) ===== */
    .panel-compact {
      width: fit-content;
      max-width: 100%;
      margin: 0 auto;
    }

    .panel-compact .form-group {
      display: grid;
      grid-template-columns: 11rem 16rem;
      align-items: center;
      column-gap: 0.75rem;
    }

    .panel-compact .form-label {
      margin: 0;
    }

    .panel-compact .form-group > :not(.form-label) {
      grid-column: 2;
    }

    @media (max-width: 640px) {
      .panel-compact {
        width: 100%;
      }

      .panel-compact .form-group {
        grid-template-columns: 1fr;
        row-gap: 0.4rem;
      }

      .panel-compact .form-group > :not(.form-label) {
        grid-column: 1;
      }
    }

    .panel-compact .form-textarea {
      resize: vertical;
    }

    .panel-compact .preview-box {
      width: 0;
      min-width: 100%;
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1>🚚 Pengiriman</h1>
    <button id="sidebarToggle" class="app-header-toggle" type="button" aria-label="Buka atau tutup sidebar" aria-expanded="true">
      ☰
    </button>
  </header>

  <div class="app-shell">
    <aside id="sidebar" class="app-sidebar">
      <div class="app-sidebar-header">Tools</div>

      <nav class="app-sidebar-nav">
        <a href="index.html" class="app-nav-item">
          <span class="app-nav-icon">🏠</span>
          <span>Beranda</span>
        </a>

        <a href="layout-a3.html" class="app-nav-item">
          <span class="app-nav-icon">📐</span>
          <span>Layout A3+</span>
        </a>

        <a href="harga-potong.html" class="app-nav-item">
          <span class="app-nav-icon">💰</span>
          <span>Harga Potong</span>
        </a>

        <a href="adjust-size.html" class="app-nav-item">
          <span class="app-nav-icon">🔧</span>
          <span>Adjust Size</span>
        </a>

        <a href="buku/buku.html" class="app-nav-item">
          <span class="app-nav-icon">📘</span>
          <span>Estimasi Buku</span>
        </a>

        <a href="indoor-outdoor/indoor-outdoor.html" class="app-nav-item">
          <span class="app-nav-icon">🖼️</span>
          <span>Indoor/Outdoor</span>
        </a>

        <a href="PDF Page Tools/index-shuffle.html" class="app-nav-item">
          <span class="app-nav-icon">📄</span>
          <span>PDF Tools</span>
        </a>

        <a href="penawaran/penawaran.html" class="app-nav-item">
          <span class="app-nav-icon">📋</span>
          <span>Penawaran Harga</span>
        </a>

        <a href="pengiriman.html" class="app-nav-item active">
          <span class="app-nav-icon">🚚</span>
          <span>Pengiriman</span>
        </a>

        <a href="mockup.html" class="app-nav-item">
          <span class="app-nav-icon">🎨</span>
          <span>Mockup</span>
        </a>
      </nav>

      <div class="app-sidebar-footer">APS Ciputat v2.0</div>
    </aside>

    <div id="overlay" class="app-overlay"></div>

    <main class="app-main">
      <div class="app-content">
        <div class="page-header">
          <h2 class="page-title">Form Pengiriman</h2>
          <p class="page-subtitle">Buat dokumen pengiriman otomatis dan cepat</p>
        </div>

        <div class="panel-compact">
        <div class="panel">
          <div class="panel-header">
            <div class="panel-icon">🚚</div>
            <div class="panel-title">Data Pengiriman</div>
          </div>

          <div class="form-group">
            <label class="form-label">Nama Customer</label>
            <textarea id="customer" class="form-textarea" placeholder="Masukkan nama customer"></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">Nomor Customer</label>
            <input id="nomorCustomer" type="text" class="form-input" placeholder="0812xxxx" />
          </div>

          <div class="form-group">
            <label class="form-label">Alamat</label>
            <textarea id="alamat" class="form-textarea" placeholder="Masukkan alamat lengkap"></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">Metode Pengiriman</label>
            <select id="metodePengiriman" class="form-select">
              <option value="jne">JNE</option>
              <option value="jnt">JNT</option>
              <option value="wahana">WAHANA</option>
              <option value="tiki">TIKI</option>
              <option value="lion parcel">LION PARCEL</option>
              <option value="ninja">NINJA</option>
              <option value="pos">POS</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Tipe Pelayanan</label>
            <select id="tipePelayanan" class="form-select">
              <option value="regular">Regular</option>
              <option value="express">Express</option>
            </select>
          </div>

          <div class="checkbox-group">
            <input id="showPreview" type="checkbox" />
            <label for="showPreview">Tampilkan Preview</label>
          </div>

          <div style="display:flex; gap:0.75rem; flex-wrap:wrap;">
            <button id="savepdf" class="btn btn-primary">Save PDF</button>
          </div>
        </div>

        <div id="previewBox" class="preview-box">
          <div class="preview-content" id="previewContent"></div>
        </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    const { jsPDF } = window.jspdf;

    const previewBox = document.getElementById("previewBox");
    const previewContent = document.getElementById("previewContent");

    function updatePreview() {
      const customer = document.getElementById("customer").value;
      const nomorCustomer = document.getElementById("nomorCustomer").value;
      const alamat = document.getElementById("alamat").value;
      const metode = document.getElementById("metodePengiriman").value;
      const tipe = document.getElementById("tipePelayanan").value;

      if (document.getElementById("showPreview").checked) {
        previewBox.classList.add("show");
        previewContent.innerHTML = `
          <strong>Pengirim :</strong><br>
          Anugerah Printshop Ciputat<br>
          Ciputat Timur, Kota Tangerang Selatan - Banten<br>
          15412<br>
          Telp 0821 2245 0210<br><br>
          <strong>Penerima :</strong><br>
          ${customer || "—"}<br>
          ${nomorCustomer || "—"}<br>
          ${alamat || "—"}<br><br>
          <strong>Metode :</strong> ${metode.toUpperCase()}<br>
          <strong>Tipe :</strong> ${tipe.charAt(0).toUpperCase() + tipe.slice(1)}
        `;
      } else {
        previewBox.classList.remove("show");
      }
    }

    document.getElementById("showPreview").addEventListener("change", updatePreview);
    document.getElementById("customer").addEventListener("input", updatePreview);
    document.getElementById("nomorCustomer").addEventListener("input", updatePreview);
    document.getElementById("alamat").addEventListener("input", updatePreview);
    document.getElementById("metodePengiriman").addEventListener("change", updatePreview);
    document.getElementById("tipePelayanan").addEventListener("change", updatePreview);

    document.getElementById("savepdf").addEventListener("click", () => {
      const customer = document.getElementById("customer").value;
      const nomorCustomer = document.getElementById("nomorCustomer").value;
      const alamat = document.getElementById("alamat").value;
      const metode = document.getElementById("metodePengiriman").value;
      const tipe = document.getElementById("tipePelayanan").value;

      const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a6" });
      const img = new Image();
      img.src = "img/background-label.png";

      img.onload = function () {
        const pageWidth = doc.internal.pageSize.getWidth();
        const pageHeight = doc.internal.pageSize.getHeight();

        doc.addImage(img, "PNG", 0, 0, pageWidth, pageHeight);

        let y = 35;
        doc.setFontSize(11);
        doc.setFont(undefined, "bold");
        doc.text("Pengirim :", 10, y);
        y += 7;

        doc.setFont(undefined, "normal");
        doc.text("Anugerah Printshop Ciputat", 10, y);
        y += 6;
        doc.text("Ciputat Timur, Kota Tangerang Selatan - Banten", 10, y);
        y += 6;
        doc.text("15412", 10, y);
        y += 6;
        doc.text("Telp 0821 2245 0210", 10, y);

        y += 12;

        doc.setFont(undefined, "bold");
        doc.text("Penerima :", 10, y);
        y += 7;

        doc.setFont(undefined, "normal");
        const text = customer + "\n" + nomorCustomer + "\n" + alamat;
        let fontSize = 11;
        let maxWidth = 85;
        let maxHeight = 45;
        let lineHeight = 6;
        let splitted = [];
        let totalHeight = 999;

        while (totalHeight > maxHeight && fontSize > 5) {
          doc.setFontSize(fontSize);
          splitted = doc.splitTextToSize(text, maxWidth);
          totalHeight = splitted.length * lineHeight;

          if (totalHeight > maxHeight) {
            fontSize -= 0.5;
          }
        }

        splitted.forEach((line) => {
          doc.text(line, 10, y);
          y += lineHeight;
        });

        let yFooter = 128;
        doc.setFont(undefined, "bold");
        doc.text("Metode Pengiriman", 10, yFooter);
        doc.text(":", 47, yFooter);
        doc.text(metode.toUpperCase(), 50, yFooter);

        yFooter += 7;
        doc.text("Tipe Pelayanan", 10, yFooter);
        doc.text(":", 47, yFooter);
        doc.text(tipe.charAt(0).toUpperCase() + tipe.slice(1), 50, yFooter);

        doc.save("label_pengiriman.pdf");
      };
    });
  </script>

  <script src="assets/sidebar.js"></script>
</body>
</html>
